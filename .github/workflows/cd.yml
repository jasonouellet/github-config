name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI workflow run ID to source tfvars artifact from"
        required: true
        type: string

jobs:
  tofu-apply:
    name: OpenTofu Apply Approved Plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    environment: production
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || github.event_name == 'workflow_dispatch'
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}

    steps:
      - name: Resolve and validate plan source
        id: plan-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run_id="$DISPATCH_CI_RUN_ID"

            run_json="$(gh api repos/${{ github.repository }}/actions/runs/"$run_id")"
            workflow_name="$(jq -r '.name' <<< "$run_json")"
            conclusion="$(jq -r '.conclusion' <<< "$run_json")"
            head_repo="$(jq -r '.head_repository.full_name' <<< "$run_json")"
            head_sha="$(jq -r '.head_sha' <<< "$run_json")"

            if [[ "$workflow_name" != "CI" ]]; then
              echo "::error::workflow_dispatch requires a run from the CI workflow."
              echo "::error::Provided run $run_id belongs to workflow '$workflow_name'."
              exit 1
            fi

            if [[ "$conclusion" != "success" ]]; then
              echo "::error::workflow_dispatch requires a successful CI run."
              echo "::error::Provided run $run_id conclusion is '$conclusion'."
              exit 1
            fi

            if [[ "$head_repo" != "${{ github.repository }}" ]]; then
              echo "::error::workflow_dispatch run must come from this repository (${{ github.repository }})."
              exit 1
            fi

            if [[ "$head_sha" != "${{ github.sha }}" ]]; then
              echo "::error::workflow_dispatch must be started on the same commit as the selected CI run."
              echo "::error::Current workflow commit is '${{ github.sha }}' but ci_run_id=$run_id head_sha is '$head_sha'."
              exit 1
            fi

            echo "plan_run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "plan_head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "tfvars_artifact_name=tfvars" >> "$GITHUB_OUTPUT"
            echo "plan_summary_artifact_name=plan-summary-$head_sha" >> "$GITHUB_OUTPUT"
          else
            run_id="${{ github.event.workflow_run.id }}"
            head_sha="${{ github.event.workflow_run.head_sha }}"

            echo "plan_run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "plan_head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "tfvars_artifact_name=tfvars" >> "$GITHUB_OUTPUT"
            echo "plan_summary_artifact_name=plan-summary-$head_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download tfvars artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.plan-source.outputs.tfvars_artifact_name }}
          run-id: ${{ steps.plan-source.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: src

      - name: Download plan summary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.plan-source.outputs.plan_summary_artifact_name }}
          run-id: ${{ steps.plan-source.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: src/ci-plan-summary

      - name: Normalize downloaded artifacts
        run: |
          set -euo pipefail

          if [[ -f src/src/repositories.auto.tfvars && ! -f src/repositories.auto.tfvars ]]; then
            mv src/src/repositories.auto.tfvars src/repositories.auto.tfvars
          fi

          if [[ -f src/ci-plan-summary/src/plan-summary.json && ! -f src/ci-plan-summary/plan-summary.json ]]; then
            mv src/ci-plan-summary/src/plan-summary.json src/ci-plan-summary/plan-summary.json
          fi

          if [[ ! -f src/repositories.auto.tfvars ]]; then
            echo "::error::Missing repositories.auto.tfvars after artifact download."
            exit 1
          fi

          if [[ ! -f src/ci-plan-summary/plan-summary.json ]]; then
            echo "::error::Missing plan-summary.json after artifact download."
            exit 1
          fi

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Export OpenTofu GitHub token
        run: echo "TF_VAR_github_token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Verify GitHub App token access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          response="$(gh api repos/${{ github.repository }}/actions/permissions 2>&1)" || {
            echo "::error::GitHub App token preflight failed while checking repository permissions for ${{ github.repository }}."
            echo "::error::API response: $response"
            echo "::error::Ensure the app is installed on this repository and has required repository permissions (including Administration: Read and write)."
            exit 1
          }

      - name: OpenTofu Init
        working-directory: src
        run: tofu init

      - name: OpenTofu Plan
        working-directory: src
        run: tofu plan -no-color -out=terraform.tfplan

      - name: Generate local plan summary
        working-directory: src
        run: |
          set -euo pipefail
          tofu show -json terraform.tfplan | jq '{
            resource_changes: ([.resource_changes[]? | {
              address,
              mode,
              type,
              name,
              actions: (.change.actions | sort)
            }] | sort_by(.address)),
            output_changes: ([.output_changes | to_entries[]? | {
              name: .key,
              actions: (.value.actions | sort)
            }] | sort_by(.name))
          }' > plan-summary-local.json

      - name: Validate plan summary equivalence
        working-directory: src
        run: |
          set -euo pipefail
          if ! cmp -s plan-summary-local.json ci-plan-summary/plan-summary.json; then
            echo "::error::CD plan summary differs from CI summary."
            diff -u ci-plan-summary/plan-summary.json plan-summary-local.json || true
            exit 1
          fi

      - name: OpenTofu Apply Approved Plan
        working-directory: src
        run: tofu apply -auto-approve terraform.tfplan

      - name: Post Apply summary
        if: always()
        run: |
          echo "## OpenTofu Apply Summary" >> $GITHUB_STEP_SUMMARY
          echo "Applied at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Applied commit: ${{ steps.plan-source.outputs.plan_head_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "tfvars artifact: ${{ steps.plan-source.outputs.tfvars_artifact_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Plan summary artifact: ${{ steps.plan-source.outputs.plan_summary_artifact_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Source CI run id: ${{ steps.plan-source.outputs.plan_run_id }}" >> $GITHUB_STEP_SUMMARY
