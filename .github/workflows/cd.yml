name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Type 'apply' to confirm running tofu apply"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  generate-tfvars:
    name: Generate tfvars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate repositories.auto.tfvars.json
        run: python scripts/generate_tfvars.py

      - name: Upload tfvars artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfvars
          path: src/repositories.auto.tfvars.json
          retention-days: 1

  tofu-apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    needs: generate-tfvars
    environment: production
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_apply == 'apply')
    defaults:
      run:
        working-directory: src
    env:
      TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}
      TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download tfvars artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfvars
          path: src

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Plan
        run: tofu plan -no-color -out=tfplan

      - name: OpenTofu Apply
        run: tofu apply -auto-approve tfplan

      - name: Post Apply summary
        if: always()
        run: |
          echo "## OpenTofu Apply Summary" >> $GITHUB_STEP_SUMMARY
          echo "Applied at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
