name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI workflow run ID that produced the tfplan artifact"
        required: true
        type: string
      plan_artifact_name:
        description: "Plan artifact name to download (example: tfplan-<sha>)"
        required: true
        type: string

jobs:
  tofu-apply:
    name: OpenTofu Apply Approved Plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    environment: production
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: src
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download approved plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_artifact_name || format('tfplan-{0}', github.event.workflow_run.head_sha) }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: src

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Export OpenTofu GitHub token
        run: echo "TF_VAR_github_token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Verify GitHub App token access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          is_admin="$(gh api repos/${{ github.repository }} --jq '.permissions.admin // false')"
          if [[ "$is_admin" != "true" ]]; then
            echo "::error::GitHub App token lacks repository administration access for ${{ github.repository }}."
            echo "::error::Grant 'Repository permissions > Administration: Read and write' and ensure the app is installed on this repository."
            exit 1
          fi

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Apply Approved Plan
        run: tofu apply -auto-approve tfplan

      - name: Post Apply summary
        if: always()
        run: |
          echo "## OpenTofu Apply Summary" >> $GITHUB_STEP_SUMMARY
          echo "Applied at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
