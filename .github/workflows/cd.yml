name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI workflow run ID that produced the tfplan artifact"
        required: true
        type: string
      plan_artifact_name:
        description: "Plan artifact name to download (example: tfplan-<sha>)"
        required: false
        type: string

jobs:
  tofu-apply:
    name: OpenTofu Apply Approved Plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    environment: production
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: src
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}

    steps:
      - name: Resolve and validate plan source
        id: plan-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_CI_RUN_ID: ${{ inputs.ci_run_id }}
          DISPATCH_PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run_id="$DISPATCH_CI_RUN_ID"

            run_json="$(gh api repos/${{ github.repository }}/actions/runs/"$run_id")"
            workflow_name="$(jq -r '.name' <<< "$run_json")"
            conclusion="$(jq -r '.conclusion' <<< "$run_json")"
            head_repo="$(jq -r '.head_repository.full_name' <<< "$run_json")"
            head_sha="$(jq -r '.head_sha' <<< "$run_json")"

            if [[ "$workflow_name" != "CI" ]]; then
              echo "::error::workflow_dispatch requires a run from the CI workflow."
              echo "::error::Provided run $run_id belongs to workflow '$workflow_name'."
              exit 1
            fi

            if [[ "$conclusion" != "success" ]]; then
              echo "::error::workflow_dispatch requires a successful CI run."
              echo "::error::Provided run $run_id conclusion is '$conclusion'."
              exit 1
            fi

            if [[ "$head_repo" != "${{ github.repository }}" ]]; then
              echo "::error::workflow_dispatch run must come from this repository (${{ github.repository }})."
              exit 1
            fi

            expected_artifact="tfplan-$head_sha"
            input_artifact="$DISPATCH_PLAN_ARTIFACT_NAME"

            if [[ "$head_sha" != "${{ github.sha }}" ]]; then
              echo "::error::workflow_dispatch must be started on the same commit as the selected CI run."
              echo "::error::Current workflow commit is '${{ github.sha }}' but ci_run_id=$run_id head_sha is '$head_sha'."
              exit 1
            fi

            if [[ -n "$input_artifact" && "$input_artifact" != "$expected_artifact" ]]; then
              echo "::error::plan_artifact_name mismatch. Expected '$expected_artifact' from ci_run_id=$run_id."
              exit 1
            fi

            echo "plan_run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "plan_head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "plan_artifact_name=$expected_artifact" >> "$GITHUB_OUTPUT"
          else
            run_id="${{ github.event.workflow_run.id }}"
            head_sha="${{ github.event.workflow_run.head_sha }}"

            echo "plan_run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "plan_head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "plan_artifact_name=tfplan-$head_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download approved plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.plan-source.outputs.plan_artifact_name }}
          run-id: ${{ steps.plan-source.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: src

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Export OpenTofu GitHub token
        run: echo "TF_VAR_github_token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Verify GitHub App token access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! gh api repos/${{ github.repository }}/actions/permissions >/dev/null 2>&1; then
            echo "::error::GitHub App token lacks repository administration access for ${{ github.repository }}."
            echo "::error::Grant 'Repository permissions > Administration: Read and write' and ensure the app is installed on this repository."
            exit 1
          fi

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Apply Approved Plan
        run: tofu apply -auto-approve terraform.tfplan

      - name: Post Apply summary
        if: always()
        run: |
          echo "## OpenTofu Apply Summary" >> $GITHUB_STEP_SUMMARY
          echo "Applied at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
