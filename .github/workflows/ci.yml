name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  yaml-validate:
    name: YAML Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate config files
        run: python scripts/validate_config.py --report reports/sonar-issues.json

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  generate-tfvars:
    name: Generate tfvars
    runs-on: ubuntu-latest
    needs: yaml-validate
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate repositories.auto.tfvars
        run: python scripts/generate_tfvars.py

      - name: Upload tfvars artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfvars
          path: src/repositories.auto.tfvars
          retention-days: 1

  tofu-validate:
    name: tofu-validate
    runs-on: ubuntu-latest
    needs: generate-tfvars
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download tfvars artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfvars
          path: src

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: OpenTofu Init
        id: init
        run: tofu init -backend=false

      - name: OpenTofu Validate
        id: validate
        run: tofu validate

  tofu-test:
    name: OpenTofu Unit Tests
    runs-on: ubuntu-latest
    needs: generate-tfvars

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download tfvars artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfvars
          path: src

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: Init root module
        working-directory: src
        run: tofu init -backend=false

      - name: Init module test harness
        working-directory: test/module
        run: tofu init -backend=false

      - name: Run module unit tests
        working-directory: test/module
        run: tofu test

      - name: Run root module tests
        working-directory: src
        run: |
          cp ../test/root_module.tftest.hcl .
          tofu test
          rm -f root_module.tftest.hcl

  tofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    needs: [tofu-validate, tofu-test]
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: src
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download tfvars artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfvars
          path: src

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Export OpenTofu GitHub token
        run: echo "TF_VAR_github_token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Plan
        id: plan
        run: |
          set +e
          tofu plan -no-color -out=tfplan | tee plan.stdout
          plan_exit=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat plan.stdout
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$plan_exit"
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        if: github.event_name == 'pull_request'
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          GH_ACTOR: ${{ github.actor }}
          GH_EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const planOutcome = process.env.PLAN_OUTCOME || "unknown";
            const planStdout = process.env.PLAN_STDOUT || "";
            const actor = process.env.GH_ACTOR || "unknown";
            const eventName = process.env.GH_EVENT_NAME || "unknown";

            const output = `#### OpenTofu Plan 📖
            \`${planOutcome}\`

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${planStdout}
            \`\`\`

            </details>

            *Pushed by: @${actor}, Action: \`${eventName}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: OpenTofu Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload approved plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ github.sha }}
          path: |
            src/tfplan
            src/repositories.auto.tfvars
          retention-days: 7

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check scripts/
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [yaml-validate, generate-tfvars, tofu-validate, tofu-test, tofu-plan, python-lint]
    if: always()
    steps:
      - name: Post CI Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| YAML Validation | ${{ needs.yaml-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Format Check & tfvars | ${{ needs.generate-tfvars.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Init & Validate | ${{ needs.tofu-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.tofu-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plan | ${{ needs.tofu-plan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Lint | ${{ needs.python-lint.result }} |" >> $GITHUB_STEP_SUMMARY

          # Fail if any job failed
          if [[ "${{ needs.yaml-validate.result }}" == "failure" || \
                "${{ needs.generate-tfvars.result }}" == "failure" || \
                "${{ needs.tofu-validate.result }}" == "failure" || \
                "${{ needs.tofu-test.result }}" == "failure" || \
                "${{ needs.tofu-plan.result }}" == "failure" || \
                "${{ needs.python-lint.result }}" == "failure" ]]; then
            exit 1
          fi
