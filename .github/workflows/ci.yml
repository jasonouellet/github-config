name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  yaml-validate:
    name: YAML Schema Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate config files
        run: python scripts/validate_config.py --report reports/sonar-issues.json

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  generate-tfvars:
    name: Generate tfvars
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: yaml-validate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup IaC CLI
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: IaC Format Check
        run: tofu fmt -check -recursive

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate repositories.auto.tfvars
        run: python scripts/generate_tfvars.py

      - name: Upload tfvars artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfvars
          path: src/repositories.auto.tfvars
          retention-days: 1

  iac:
    name: IaC Checks And Plan
    runs-on: ubuntu-latest
    needs: generate-tfvars
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: src
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download tfvars artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfvars
          path: src

      - name: Setup IaC CLI
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: "~1.10"

      - name: IaC Init (No Backend)
        run: tofu init -backend=false

      - name: IaC Validate
        run: tofu validate

      - name: Init Module Test Harness
        working-directory: test/module
        run: tofu init -backend=false

      - name: Run Module Unit Tests
        working-directory: test/module
        run: tofu test

      - name: Run Root Module Tests
        run: |
          cp ../test/root_module.tftest.hcl .
          tofu test
          rm -f root_module.tftest.hcl

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Export IaC GitHub token
        run: echo "TF_VAR_github_token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: IaC Init (Backend)
        run: tofu init

      - name: IaC Plan
        id: plan
        run: |
          set +e
          tofu plan -no-color -out=terraform.tfplan | tee plan.stdout
          plan_exit=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat plan.stdout
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$plan_exit"
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        if: github.event_name == 'pull_request'
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          GH_ACTOR: ${{ github.actor }}
          GH_EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const planOutcome = process.env.PLAN_OUTCOME || "unknown";
            const planStdout = process.env.PLAN_STDOUT || "";
            const actor = process.env.GH_ACTOR || "unknown";
            const eventName = process.env.GH_EVENT_NAME || "unknown";

            const output = `#### IaC Plan 📖
            \`${planOutcome}\`

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${planStdout}
            \`\`\`

            </details>

            *Pushed by: @${actor}, Action: \`${eventName}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: IaC Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Generate Plan Summary Artifact
        if: steps.plan.outcome == 'success'
        run: |
          set -euo pipefail
          tofu show -json terraform.tfplan | jq '{
            resource_changes: ([.resource_changes[]? | {
              address,
              mode,
              type,
              name,
              actions: (.change.actions | sort)
            }] | sort_by(.address)),
            output_changes: ([.output_changes | to_entries[]? | {
              name: .key,
              actions: (.value.actions | sort)
            }] | sort_by(.name))
          }' > plan-summary.json

      - name: Upload plan summary artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-summary-${{ github.sha }}
          path: src/plan-summary.json
          retention-days: 7

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check scripts/
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [yaml-validate, generate-tfvars, iac, python-lint]
    if: always()
    steps:
      - name: Post CI Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| YAML Validation | ${{ needs.yaml-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Format Check & tfvars | ${{ needs.generate-tfvars.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC Checks & Plan | ${{ needs.iac.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Lint | ${{ needs.python-lint.result }} |" >> $GITHUB_STEP_SUMMARY

          # Fail if any job failed
          if [[ "${{ needs.yaml-validate.result }}" == "failure" || \
                "${{ needs.generate-tfvars.result }}" == "failure" || \
                "${{ needs.iac.result }}" == "failure" || \
                "${{ needs.python-lint.result }}" == "failure" ]]; then
            exit 1
          fi
