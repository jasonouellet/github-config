# Configuration for repository: example-service
name: example-service
description: "Example microservice repository."
visibility: private
is_template: false
auto_init: true
gitignore_template: null
license_template: null
topics:
  - microservice
  - example
archived: false
rulesets:
  - name: main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      required_signatures: false
      pull_request:
        required_approving_review_count: 1
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: false
